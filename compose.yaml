services:
    app:
        container_name: tech-test-soundsmarket-app
        build:
            context: ./vendor/laravel/sail/runtimes/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.4/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - tech-test-soundsmarket

    phpliteadmin:
        image: vtacquet/phpliteadmin:latest
        container_name: tech-test-soundsmarket-phpliteadmin
        ports:
            - '${PHPLITEADMIN_PORT:-8081}:80'
        volumes:
            - './database/database.sqlite:/db/internal.sqlite'
        environment:
            - LOCATION=/db
        networks:
            - tech-test-soundsmarket

networks:
    tech-test-soundsmarket:
        name: tech-test-soundsmarket
        driver: bridge
